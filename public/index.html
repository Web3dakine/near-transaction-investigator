
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090711">
<meta name="description" content="Understand NEAR blockchain transactions in plain language.">
<title>NEAR Transaction Investigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#090711;--panel:#151020;--line:#382b50;--text:#f6f1ff;--muted:#aaa1c2;--purple:#c4b5fd;--pink:#e9a8fa;--green:#a7f3d0;--amber:#fcd38d;--red:#fda4af}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0%,#38205b 0,transparent 40%),radial-gradient(ellipse at 95% 10%,#35143c 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.7 Manrope,system-ui,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;transition:transform .18s,filter .18s,border-color .18s}
button:hover{filter:brightness(1.1);transform:translateY(-1px)}
button:disabled{opacity:.55;cursor:wait;transform:none}
.shell{width:min(1120px,calc(100% - 32px));margin:auto;padding:25px 0 50px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:48px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:43px;height:43px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#c4b5fd,#e9a8fa);color:#190e29;font-size:23px;font-weight:800}
.brand-name{font-weight:800;letter-spacing:-.04em}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase}
.header-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
select,input,textarea{background:#0b0814;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;width:100%}
select{width:auto;padding:9px;background:#171126}
input:focus,textarea:focus,select:focus{outline:2px solid #a78bfa88;outline-offset:2px}
.network{font-size:10px;border:1px solid var(--line);padding:8px 12px;border-radius:99px;color:var(--muted)}
.hero{text-align:center;max-width:790px;margin:0 auto 35px}
.eyebrow{text-transform:uppercase;color:var(--purple);font-size:10px;font-weight:800;letter-spacing:.2em}
h1{font-size:clamp(36px,7vw,65px);line-height:1.08;letter-spacing:-.07em;margin:16px 0}
.gradient{background:linear-gradient(100deg,#f5f0ff,#c4b5fd,#f0abfc);color:transparent;background-clip:text}
.hero p{color:var(--muted);max-width:660px;margin:auto}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:linear-gradient(145deg,rgba(29,22,46,.96),rgba(15,12,25,.96));border:1px solid var(--line);border-radius:22px;padding:23px;min-width:0;box-shadow:0 20px 60px #0003;transition:border-color .2s,box-shadow .2s}
.panel:hover{border-color:#8064a8;box-shadow:0 20px 65px #0005,0 0 24px #8b5cf610}
.panel h2{font-size:17px;margin:0 0 5px}
.desc{color:var(--muted);font-size:12px;margin:0 0 20px}
label{display:block;margin:15px 0 7px;font-size:12px;font-weight:700}
textarea{min-height:125px;resize:vertical;font:12px/1.6 "DM Mono",monospace}
.hint{font-size:10px;color:var(--muted);margin-top:8px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-weight:800;font-size:11px;color:var(--text);background:#ffffff08}
.primary{background:linear-gradient(110deg,#c4b5fd,#e9a8fa);color:#190e29;border:0}
.results{margin-top:16px}
.results-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.pill{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:6px 10px;color:var(--muted)}
.pill.good{color:var(--green)}.pill.warn{color:var(--amber)}.pill.bad{color:var(--red)}
.result-title{font-size:clamp(24px,4vw,34px);line-height:1.2;letter-spacing:-.055em;margin:17px 0 10px}
.summary{color:#ded5ef}
.confidence{font-size:11px;color:var(--muted);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.stat{border:1px solid var(--line);background:#ffffff05;border-radius:14px;padding:13px}
.stat span{display:block;font-size:11px;color:var(--muted)}
.stat strong{font-size:25px}
.plain{border:1px solid #a78bfa44;background:linear-gradient(120deg,#8b5cf615,#e9a8fa08);border-radius:16px;padding:17px;margin-top:18px}
.plain h3{margin:0 0 12px;color:var(--purple);font-size:13px}
.plain article{background:#ffffff05;border-radius:12px;padding:12px;margin-top:10px}
.plain article strong{font-size:12px}
.plain article p{margin:5px 0 0;font-size:13px;color:#e0d7ef}
.refund{border:1px solid #fcd38d44;background:#fcd38d0a;border-radius:14px;padding:14px;margin-top:15px}
.refund strong{color:var(--amber);font-size:13px}
.refund p{font-size:12px;margin:5px 0 0;color:#ded4e8}
.section{border-top:1px solid var(--line);margin-top:20px;padding-top:16px}
.section h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
ul.evidence{padding-left:20px;overflow-wrap:anywhere;font-size:12px}
ul.evidence li{margin:9px 0;color:#ded7ed}
details{border:1px solid var(--line);border-radius:15px;margin-top:14px;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:15px;font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";color:var(--purple);font-size:18px}
details[open] summary:after{content:"−"}
.details-body{padding:0 15px 15px}
.raw{white-space:pre-wrap;overflow-wrap:anywhere;max-height:350px;overflow:auto;padding:13px;background:#08060f;border-radius:10px;font:11px/1.6 "DM Mono",monospace}
.empty{text-align:center;padding:34px 15px;border:1px dashed var(--line);border-radius:15px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:10px;margin-top:30px}
@media(max-width:760px){.workspace{grid-template-columns:1fr}.shell{width:calc(100% - 22px);padding-top:15px}header{margin-bottom:35px}.panel{padding:17px}.stats{gap:7px}.stat{padding:10px}.stat strong{font-size:22px}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand">
    <div class="logo">N</div>
    <div><div class="brand-name">NEAR Transaction Investigator</div><div class="brand-sub" data-i18n="brandSub"></div></div>
  </div>
  <div class="header-actions">
    <label for="languageSelect" style="margin:0" data-i18n="languageLabel"></label>
    <select id="languageSelect" aria-label="Choose language">
      <option value="en">English</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="pt">Português</option>
    </select>
    <span class="network">● NEAR Mainnet</span>
  </div>
</header>

<section class="hero">
  <div class="eyebrow" data-i18n="eyebrow"></div>
  <h1><span data-i18n="headline1"></span><br><span class="gradient" data-i18n="headline2"></span></h1>
  <p data-i18n="heroCopy"></p>
</section>

<div class="workspace">
  <section class="panel">
    <h2 data-i18n="analyzeTitle"></h2>
    <p class="desc" data-i18n="analyzeDesc"></p>
    <label for="errorInput" data-i18n="errorLabel"></label>
    <textarea id="errorInput" data-placeholder="errorPlaceholder"></textarea>
    <div class="actions">
      <button class="btn primary" id="analyzeBtn" data-i18n="analyzeBtn"></button>
      <button class="btn" id="sampleBtn" data-i18n="sampleBtn"></button>
      <button class="btn" id="clearBtn" data-i18n="clearBtn"></button>
    </div>
  </section>
  <section class="panel">
    <h2 data-i18n="lookupTitle"></h2>
    <p class="desc" data-i18n="lookupDesc"></p>
    <label for="txHash" data-i18n="hashLabel"></label>
    <input id="txHash" autocomplete="off" placeholder="Transaction hash">
    <label for="sender" data-i18n="senderLabel"></label>
    <input id="sender" autocomplete="off" placeholder="example.near">
    <p class="hint" data-i18n="lookupHint"></p>
    <div class="actions"><button class="btn primary" id="lookupBtn" data-i18n="lookupBtn"></button></div>
  </section>
</div>

<section class="panel results">
  <div class="results-head"><div class="kicker" data-i18n="reportLabel"></div><span class="pill" id="statusPill"></span></div>
  <div id="result"></div>
</section>
<footer data-i18n="footer"></footer>
</div>

slipNext:"Confira o histórico de transferências de USDT e o saldo. Se o reembolso não aparecer, use o hash em um explorador NEAR confiável. Revise o preço e a configuração de slippage antes de tentar novamente.",
genericWhat:"O relatório usa os status, registros e erros retornados pelo NEAR RPC para explicar quais partes da transação foram concluídas ou falharam.",
genericFunds:"O status de uma transação, sozinho, não prova que os fundos chegaram. Confira as transferências de tokens e o saldo do destinatário.",
genericNext:"Revise o erro do recibo com falha. Confira os registros de transferência e verifique as movimentações em um explorador confiável.",
lookupMissing:"Informe o hash da transação e a conta remetente.",querying:"Consultando provedores RPC…",loading:"Obtendo registros da transação…",lookupFailed:"Não foi possível consultar a transação",lookupFailedDesc:"A consulta não foi concluída. Isso não prova que a transação falhou.",
rpcError:"O RPC retornou um erro",rpcErrorDesc:"O provedor não conseguiu concluir a consulta. Isso não prova que a transação falhou.",
noResult:"O serviço não retornou nenhum resultado.",badJson:"O serviço retornou uma resposta inesperada.",
copy:"Copiar resposta original",copied:"Copiado",copyFail:"Falha ao copiar",noInput:"Cole primeiro uma mensagem de erro ou resposta JSON.",
sampleError:"Exemplo: erro do contrato: E68: slippage error",noMatch:"Nenhum padrão de erro reconhecido",
noMatchDesc:"Não foi possível identificar um padrão conhecido. Confira a resposta original.",slippage:"Troca rejeitada por slippage",notObserved:"O nó não observou a transação",shard:"O nó RPC não acompanha o shard necessário",
invalid:"Transação rejeitada durante a validação",timeout:"A consulta expirou",failedReceipt:"Um recibo falhou",successReceipt:"A transação informa sucesso",needsReview:"O resultado precisa ser verificado",
topSuccess:"A transação principal informa sucesso",hash:"Hash da transação",sender:"Conta remetente",http:"Status HTTP RPC",topStatus:"Status principal",receiptCount:"Recibos retornados",block:"Hash do bloco",
refundEvidence:"Os registros mencionam transferência ou reembolso, mas isso não prova por si só que os fundos chegaram à conta.",

}
};

function t(key){return (T[language]&&T[language][key])||T.en[key]||key}
function esc(value){return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function setPill(text,tone=""){const p=$("statusPill");p.textContent=text;p.className="pill "+tone}
function setLanguage(lang){
 language=T[lang]?lang:"en";
 document.documentElement.lang=language;
 $("languageSelect").value=language;
 document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
 document.querySelectorAll("[data-placeholder]").forEach(el=>el.placeholder=t(el.dataset.placeholder));
 if(lastReport)render(lastReport);
}
function flatten(value,prefix="",out=[]){
 if(value&&typeof value==="object"){for(const [k,v] of Object.entries(value))flatten(v,prefix?prefix+"."+k:k,out)}
 else out.push([prefix,String(value)]);
 return out;
}
function has(status,key){return !!status&&Object.prototype.hasOwnProperty.call(status,key)}
function statusOf(receipt){return receipt?.outcome?.status||{}}
function isSuccess(status){return has(status,"SuccessValue")||has(status,"SuccessReceiptId")}
function isFailure(status){return has(status,"Failure")}
function collectText(value,out=[]){
 if(typeof value==="string")out.push(value);
 else if(Array.isArray(value))value.forEach(v=>collectText(v,out));
 else if(value&&typeof value==="object")Object.values(value).forEach(v=>collectText(v,out));
 return out;
}
function classifyTxResult(data,hash,sender,httpStatus){
 const r=data.result||{};
 const receipts=Array.isArray(r.receipts_outcome)?r.receipts_outcome:[];
 const txStatus=r.status||r.transaction_outcome?.outcome?.status||{};
 const failed=receipts.filter(x=>isFailure(statusOf(x)));
 const successful=receipts.filter(x=>isSuccess(statusOf(x)));
 const unknown=receipts.filter(x=>!isFailure(statusOf(x))&&!isSuccess(statusOf(x)));
 const txSucceeded=isSuccess(txStatus);
 const failureText=collectText(failed.map(x=>statusOf(x).Failure||"")).join(" ");
 const allLogs=receipts.flatMap(x=>x.outcome?.logs||[]);
 const allText=collectText([failureText,allLogs]).join(" ");
 const slippage=/slippage|E68/i.test(allText);
 const refundLogs=allLogs.filter(log=>/ft_transfer/i.test(log)&&/refund/i.test(log));
 const refundRecorded=refundLogs.some(log=>log.includes(sender));
 const facts=[
  `${t("hash")}: ${hash}`,
  `${t("sender")}: ${sender}`,
  `${t("http")}: ${httpStatus}`,
  `${t("topStatus")}: ${JSON.stringify(txStatus)}`,
  `${t("block")}: ${r.transaction_outcome?.block_hash||"Not returned"}`,
  `${t("receiptCount")}: ${receipts.length}`,
  `${t("success")}: ${successful.length}`,
  `${t("failed")}: ${failed.length}`,
  `${t("unknown")}: ${unknown.length}`
 ];
 receipts.forEach((receipt,i)=>{
  const o=receipt.outcome||{},s=o.status||{};
  const label=isFailure(s)?"FAILED":isSuccess(s)?"SUCCESS":"UNKNOWN";
  facts.push(`Receipt ${i+1} status: ${label} (${receipt.id||"ID unavailable"})`);
  facts.push(`Receipt ${i+1} executor: ${o.executor_id||receipt.receiver_id||"Not returned"}`);
  if(isFailure(s))facts.push(`Receipt ${i+1} failure: ${JSON.stringify(s.Failure)}`);
  (o.logs||[]).filter(log=>/refund|transfer|slippage|panic|error|fail/i.test(log)).slice(0,4).forEach(log=>facts.push(`Receipt ${i+1} log: ${log}`));
 });
 const report={
  kind:"transaction",hash,sender,raw:JSON.stringify(data,null,2),facts,
  failedCount:failed.length,successCount:successful.length,unknownCount:unknown.length,
  slippage,refundRecorded,tone:failed.length?"bad":txSucceeded?"good":"warn"
 };
 if(slippage){
  report.title=t("slipTitle");
  report.summary=t("slipWhat");
 }else if(failed.length){
  report.title=t("failedReceipt");
  report.summary=`${failed.length} receipt(s) failed and ${successful.length} succeeded. The top level status alone does not explain the final movement of funds.`;
 }else if(txSucceeded){
  report.title=t("successReceipt");
  report.summary=`${successful.length} successful receipt(s) were found. Check transfer records if you need to confirm a token movement.`;
 }else{
  report.title=t("needsReview");
  report.summary=t("genericWhat");
 }
 return report;
}
function diagnose(input){
 let parsed=null;try{parsed=JSON.parse(input)}catch{}
 const flat=parsed?flatten(parsed):[];
 const text=(input+" "+flat.map(x=>x.join(" ")).join(" ")).toLowerCase();
 let report={kind:"error",title:t("noMatch"),summary:t("noMatchDesc"),tone:"warn",facts:flat.slice(0,15).map(([k,v])=>`${k}: ${v}`),raw:parsed?JSON.stringify(parsed,null,2):input,actions:[t("genericNext")]};
 if(/slippage|e68/.test(text)){
  report.title=t("slippage");report.summary=t("slipWhat");report.tone="bad";report.slippage=true;
 }else if(/not_observed/.test(text)){
  report.title=t("notObserved");report.summary=t("lookupConnection");
 }else if(/does_not_track_shard/.test(text)){
  report.title=t("shard");report.summary=t("lookupConnection");
 }else if(/invalid_transaction|invalid transaction/.test(text)){
  report.title=t("invalid");report.summary=t("genericNext");report.tone="bad";
 }else if(/timeout|timed out/.test(text)){
  report.title=t("timeout");report.summary=t("lookupConnection");
 }
 if(!report.facts.length)report.facts=["No specific structured error fields were found."];
 return report;
}
function render(report){
 lastReport=report;
 const tx=report.kind==="transaction";
 const facts=report.facts||[];
 const plainWhat=report.slippage?t("slipWhat"):t("genericWhat");
 const plainFunds=report.refundRecorded?t("slipFunds"):t("genericFunds");
 const plainNext=report.slippage?t("slipNext"):t("genericNext");
 const stats=tx?`<div class="stats"><div class="stat"><span>${esc(t("success"))}</span><strong>${report.successCount}</strong></div><div class="stat"><span>${esc(t("failed"))}</span><strong>${report.failedCount}</strong></div><div class="stat"><span>${esc(t("unknown"))}</span><strong>${report.unknownCount}</strong></div></div>`:"";
 const plain=tx||report.slippage?`<section class="plain"><h3>${esc(t("plainTitle"))}</h3><article><strong>${esc(t("what"))}</strong><p>${esc(plainWhat)}</p></article><article><strong>${esc(t("funds"))}</strong><p>${esc(plainFunds)}</p></article><article><strong>${esc(t("next"))}</strong><p>${esc(plainNext)}</p></article></section>`:"";
 const refund=tx&&report.refundRecorded?`<div class="refund"><strong>${esc(t("refund"))}</strong><p>${esc(t("refundDesc"))}</p></div>`:"";
 const actions=(report.actions||[plainNext]).map(x=>`<li>${esc(x)}</li>`).join("");
 result.innerHTML=`<div class="result-title">${esc(report.title)}</div><div class="summary">${esc(report.summary||"")}</div><div class="confidence">${esc(t("confidence"))}: ${esc(report.confidence||"Based on the RPC response and receipt logs. Verify financial outcomes separately.")}</div>${stats}${plain}${refund}<div class="section"><h3>${esc(t("recommended"))}</h3><ul class="evidence">${actions}</ul></div><details><summary>${esc(t("technical"))}<span>${facts.length} ${esc(t("evidence"))}</span></summary><div class="details-body"><ul class="evidence">${facts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></details><details><summary>${esc(t("original"))}</summary><div class="details-body"><div class="raw">${esc(report.raw||"No raw response available.")}</div><div class="actions"><button class="btn" id="copyBtn">${esc(t("copy"))}</button></div></div></details>`;
 setPill(report.title,report.tone||"");
 const copy=$("copyBtn");
 if(copy)copy.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(report.raw||"");copy.textContent=t("copied")}catch{copy.textContent=t("copyFail")}});
}
function showEmpty(){result.innerHTML=`<div class="empty"><strong>${esc(t("emptyTitle"))}</strong><br>${esc(t("emptyDesc"))}</div>`;setPill(t("waiting"))}

$("languageSelect").addEventListener("change",e=>setLanguage(e.target.value));
$("analyzeBtn").addEventListener("click",()=>{
 const input=$("errorInput").value.trim();
 if(!input){render({title:t("noInput"),summary:t("noInput"),tone:"warn",facts:[],actions:[t("noInput")],raw:""});return}
 render(diagnose(input));
});
$("sampleBtn").addEventListener("click",()=>{
 const sample='{"error":{"cause":{"name":"SmartContractPanic","info":{"panic_msg":"E68: slippage error"}}}}';
 $("errorInput").value=sample;
 render(diagnose(sample));
});
$("clearBtn").addEventListener("click",()=>{$("errorInput").value="";lastReport=null;showEmpty()});
$("lookupBtn").addEventListener("click",async()=>{
 const hash=$("txHash").value.trim(),sender=$("sender").value.trim(),button=$("lookupBtn");
 if(!hash||!sender){render({title:t("lookupMissing"),summary:t("lookupMissing"),tone:"warn",facts:[],actions:[t("lookupMissing")],raw:""});return}
 button.disabled=true;button.textContent=t("querying");setPill(t("querying"),"warn");
 result.innerHTML=`<div class="empty">${esc(t("loading"))}</div>`;
 const controller=new AbortController();
 const timer=setTimeout(()=>controller.abort(),65000);
 try{
  const response=await fetch("/api/rpc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({method:"tx",params:[hash,sender]}),signal:controller.signal});
  const body=await response.text();
  let data;try{data=JSON.parse(body)}catch{throw new Error(t("badJson"))}
  if(!response.ok)throw new Error(data.error||t("lookupFailedDesc"));
  if(data.error){render({title:t("rpcError"),summary:t("rpcErrorDesc"),tone:"warn",facts:[JSON.stringify(data.error)],actions:[t("lookupConnection")],raw:JSON.stringify(data,null,2)});return}
  if(!data.result)throw new Error(t("noResult"));
  render(classifyTxResult(data,hash,sender,response.status));
 }catch(error){
  render({title:t("lookupFailed"),summary:t("lookupFailedDesc"),tone:"warn",facts:[String(error.message||error)],actions:[t("lookupConnection")],raw:String(error.stack||error)});
 }finally{
  clearTimeout(timer);button.disabled=false;button.textContent=t("lookupBtn");
 }
});
const browserLang=(navigator.languages?.[0]||navigator.language||"en").toLowerCase();
const detected=browserLang.startsWith("es")?"es":browserLang.startsWith("fr")?"fr":browserLang.startsWith("pt")?"pt":"en";
setLanguage(detected);
showEmpty();
})();
</script>
